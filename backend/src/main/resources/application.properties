spring.application.name=adaptiq-backend
server.port=8080

# --- MySQL ---
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:adaptiq}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# --- JWT ---
jwt.secret=${JWT_SECRET:adaptiq-dev-secret-change-me-adaptiq-dev-secret-change-me}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- AI microservice (FastAPI) ---
ai.service.url=${AI_SERVICE_URL:http://localhost:8001}

# --- CORS ---
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# --- OAuth (Google & GitHub) ---
oauth.google.client-id=${GOOGLE_CLIENT_ID:}
oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
oauth.github.client-id=${GITHUB_CLIENT_ID:}
oauth.github.client-secret=${GITHUB_CLIENT_SECRET:}
